<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-label="Population vector artifact"><title>Population vector artifact</title><defs><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#69737a"/></marker><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9b4426"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e6da4"/></marker></defs><circle cx="300" cy="270" r="190" fill="none" stroke="#d3d9dc" stroke-width="1.5"/><line x1="300" y1="270" x2="186.2" y2="300.3" stroke="#69737a" stroke-width="2" marker-end="url(#g)"/><line x1="300" y1="270" x2="250.0" y2="376.7" stroke="#69737a" stroke-width="2" marker-end="url(#g)"/><line x1="300" y1="270" x2="367.4" y2="366.6" stroke="#69737a" stroke-width="2" marker-end="url(#g)"/><line x1="300" y1="270" x2="413.7" y2="300.7" stroke="#69737a" stroke-width="2" marker-end="url(#g)"/><line x1="300" y1="270" x2="417.8" y2="270.2" stroke="#69737a" stroke-width="2" marker-end="url(#g)"/><line x1="300" y1="270" x2="413.8" y2="239.7" stroke="#69737a" stroke-width="2" marker-end="url(#g)"/><line x1="300" y1="270" x2="402.1" y2="211.3" stroke="#69737a" stroke-width="2" marker-end="url(#g)"/><line x1="300" y1="270" x2="383.4" y2="186.9" stroke="#69737a" stroke-width="2" marker-end="url(#g)"/><line x1="300" y1="270" x2="350.0" y2="163.3" stroke="#69737a" stroke-width="2" marker-end="url(#g)"/><line x1="300" y1="270" x2="289.9" y2="152.6" stroke="#69737a" stroke-width="2" marker-end="url(#g)"/><line x1="300" y1="270" x2="203.6" y2="202.3" stroke="#69737a" stroke-width="2" marker-end="url(#g)"/><line x1="300" y1="270" x2="182.6" y2="280.1" stroke="#69737a" stroke-width="2" marker-end="url(#g)"/><line x1="300" y1="270" x2="453.7" y2="158.3" stroke="#9b4426" stroke-width="6" marker-end="url(#a)"/><line x1="300" y1="270" x2="146.3" y2="381.7" stroke="#2e6da4" stroke-width="6" stroke-dasharray="12 7" marker-end="url(#b)"/><text x="540" y="70" font-size="24" fill="#69737a" font-weight="400" text-anchor="start" font-family="Inter, Century Gothic, sans-serif">grey: preferred direction</text><text x="540" y="100" font-size="24" fill="#69737a" font-weight="400" text-anchor="start" font-family="Inter, Century Gothic, sans-serif">of each selected neuron</text><text x="540" y="170" font-size="26" fill="#9b4426" font-weight="600" text-anchor="start" font-family="Inter, Century Gothic, sans-serif">sum of all preferred</text><text x="540" y="202" font-size="26" fill="#9b4426" font-weight="600" text-anchor="start" font-family="Inter, Century Gothic, sans-serif">directions: 36°</text><text x="540" y="300" font-size="26" fill="#2e6da4" font-weight="600" text-anchor="start" font-family="Inter, Century Gothic, sans-serif">all neurons drop together:</text><text x="540" y="332" font-size="26" fill="#2e6da4" font-weight="600" text-anchor="start" font-family="Inter, Century Gothic, sans-serif">the vector moves the</text><text x="540" y="364" font-size="26" fill="#2e6da4" font-weight="600" text-anchor="start" font-family="Inter, Century Gothic, sans-serif">opposite way, to −144°</text><text x="540" y="440" font-size="24" fill="#69737a" font-weight="400" text-anchor="start" font-family="Inter, Century Gothic, sans-serif">same direction whatever</text><text x="540" y="470" font-size="24" fill="#69737a" font-weight="400" text-anchor="start" font-family="Inter, Century Gothic, sans-serif">the heading was</text><text x="300" y="505" font-size="20" fill="#69737a" font-weight="400" text-anchor="middle" font-family="Inter, Century Gothic, sans-serif">schematic</text></svg>
