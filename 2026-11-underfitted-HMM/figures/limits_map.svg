<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" role="img" aria-label="The four limits"><title>The four limits</title><rect x="10" y="10" width="420" height="190" rx="12" fill="#0f86a6" fill-opacity="0.1" stroke="#0f86a6" stroke-width="2"/><text x="220.0" y="118.0" font-size="40" text-anchor="middle" fill="#272d31" font-weight="400" font-family="Inter, Century Gothic, sans-serif">$\mathcal{T} = \mathbf{1}\pi^\top + \varepsilon R$</text><rect x="470" y="10" width="420" height="190" rx="12" fill="#69737a" fill-opacity="0.04" stroke="#69737a" stroke-width="2" stroke-dasharray="8 6"/><text x="680.0" y="118.0" font-size="40" text-anchor="middle" fill="#272d31" font-weight="400" font-family="Inter, Century Gothic, sans-serif">$\mathcal{T} = I + \varepsilon Q$</text><rect x="10" y="240" width="420" height="190" rx="12" fill="#b5532f" fill-opacity="0.1" stroke="#b5532f" stroke-width="2"/><text x="220.0" y="348.0" font-size="40" text-anchor="middle" fill="#272d31" font-weight="400" font-family="Inter, Century Gothic, sans-serif">$d \to \infty$</text><rect x="470" y="240" width="420" height="190" rx="12" fill="#69737a" fill-opacity="0.04" stroke="#69737a" stroke-width="2" stroke-dasharray="8 6"/><text x="680.0" y="348.0" font-size="40" text-anchor="middle" fill="#272d31" font-weight="400" font-family="Inter, Century Gothic, sans-serif">$d, L \to \infty, \ L/d = \alpha$</text><circle cx="240" cy="270" r="9" fill="#b5532f" stroke="#fff" stroke-width="2"/><text x="256" y="276" font-size="18" text-anchor="start" fill="#b5532f" font-weight="600" font-family="Inter, Century Gothic, sans-serif">zebrafish HMMs</text></svg>
