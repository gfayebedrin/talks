<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-label="Map of the four limits"><title>Map of the four limits</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#69737a"/></marker></defs><line x1="110" y1="450" x2="870" y2="450" stroke="#69737a" stroke-width="1.5" marker-end="url(#ar)"/><line x1="110" y1="450" x2="110" y2="30" stroke="#69737a" stroke-width="1.5" marker-end="url(#ar)"/><text x="490.0" y="490" font-size="18" text-anchor="middle" fill="#272d31" font-weight="400" font-family="Inter, Century Gothic, sans-serif">persistence of the hidden states</text><text x="150" y="476" font-size="15" text-anchor="middle" fill="#69737a" font-weight="400" font-family="Inter, Century Gothic, sans-serif">fast</text><text x="830" y="476" font-size="15" text-anchor="middle" fill="#69737a" font-weight="400" font-family="Inter, Century Gothic, sans-serif">slow</text><text x="44" y="240.0" font-size="18" text-anchor="middle" fill="#272d31" font-family="Inter, Century Gothic, sans-serif" transform="rotate(-90 44 240.0)">evidence per frame</text><text x="96" y="438" font-size="15" text-anchor="end" fill="#69737a" font-weight="400" font-family="Inter, Century Gothic, sans-serif">weak</text><text x="96" y="50" font-size="15" text-anchor="end" fill="#69737a" font-weight="400" font-family="Inter, Century Gothic, sans-serif">strong</text><rect x="140" y="40" width="700" height="105" rx="10" fill="#b5532f" fill-opacity="0.10" stroke="#b5532f" stroke-width="2"/><text x="490.0" y="86.5" font-size="24" text-anchor="middle" fill="#272d31" font-weight="600" font-family="Inter, Century Gothic, sans-serif">3 · High dimension</text><text x="490.0" y="116.5" font-size="19" text-anchor="middle" fill="#69737a" font-weight="400" font-family="Inter, Century Gothic, sans-serif">each frame classified alone, jumps counted</text><rect x="140" y="175" width="330" height="120" rx="10" fill="#0f86a6" fill-opacity="0.10" stroke="#0f86a6" stroke-width="2"/><text x="305.0" y="229.0" font-size="24" text-anchor="middle" fill="#272d31" font-weight="600" font-family="Inter, Century Gothic, sans-serif">1 · Fast switching</text><text x="305.0" y="259.0" font-size="19" text-anchor="middle" fill="#69737a" font-weight="400" font-family="Inter, Century Gothic, sans-serif">a mixture plus a little memory</text><rect x="510" y="175" width="330" height="120" rx="10" fill="#0f86a6" fill-opacity="0.10" stroke="#0f86a6" stroke-width="2"/><text x="675.0" y="229.0" font-size="24" text-anchor="middle" fill="#272d31" font-weight="600" font-family="Inter, Century Gothic, sans-serif">2 · Slow switching</text><text x="675.0" y="259.0" font-size="19" text-anchor="middle" fill="#69737a" font-weight="400" font-family="Inter, Century Gothic, sans-serif">whole stays sorted by look</text><rect x="140" y="325" width="700" height="105" rx="10" fill="#6f4aa0" fill-opacity="0.10" stroke="#6f4aa0" stroke-width="2"/><text x="490.0" y="371.5" font-size="24" text-anchor="middle" fill="#272d31" font-weight="600" font-family="Inter, Century Gothic, sans-serif">4 · Weak frames</text><text x="490.0" y="401.5" font-size="19" text-anchor="middle" fill="#69737a" font-weight="400" font-family="Inter, Century Gothic, sans-serif">timing can change the merge</text><circle cx="764" cy="70" r="9" fill="#b5532f" stroke="#fff" stroke-width="2"/><text x="778" y="76" font-size="16" text-anchor="start" fill="#b5532f" font-weight="600" font-family="Inter, Century Gothic, sans-serif">our fits</text></svg>
