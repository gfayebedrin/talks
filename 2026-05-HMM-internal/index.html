<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>2026-05 HMMs (internal)</title>

    <!-- Core CSS -->
    <link rel="stylesheet" href="../reveal.js/dist/reveal.css">
    <!-- Theme (choose another: black, white, league, night, serif, etc.) -->
    <link rel="stylesheet" href="../reveal.js/dist/theme/white.css" id="theme">

    <style>
        /* Use a clean sans-serif font everywhere */
        .reveal {
            font-family: "Century Gothic", "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }

        /* Titles: normal case, lighter, smaller */
        .reveal h1,
        .reveal h2,
        .reveal h3 {
            text-transform: none;
            /* disable uppercase */
            font-weight: 500;
            /* not too bold */
            letter-spacing: normal;
        }

        .reveal h1 {
            font-size: 1.4em;
            margin-bottom: 0.5em;
        }

        .reveal h2 {
            font-size: 1.1em;
            margin-bottom: 0.4em;
        }

        .reveal h3 {
            font-size: 1.0em;
            margin-bottom: 0.3em;
        }

        /* Body text */
        .reveal p {
            font-size: 0.8em;
            line-height: 1.5;
        }

        /* Lists */
        .reveal ul,
        .reveal ol,
        .reveal li {
            font-size: 0.8em;
            line-height: 1.5;
        }

        .small-text-slide ul,
        .small-text-slide li {
            font-size: 0.6em !important;
        }

        /* Display math only */
        .reveal .katex-display {
            font-size: 0.65em;
        }

        /* Footnotes */
        .reveal .slide-footnote {
            position: absolute;
            bottom: 5px;
            font-size: 0.45em;
            border-top: 1px solid #aaa;
            padding-top: 6px;
            padding-left: 10px;
            padding-right: 10px;
            text-align: left;
        }

        /* Full-window drifting checkerboard overlay (toggled per-slide in JS).
           z-index 9 keeps it below reveal's progress(10)/controls(11)/slide-number(31). */
        #ckr-overlay {
            position: fixed;
            inset: 0;
            z-index: 9;
            background: #000;
            overflow: hidden;
        }

        #ckr-overlay>div {
            position: absolute;
            inset: -400px;
            background:
                linear-gradient(45deg, #000 25%, transparent 25%),
                linear-gradient(-45deg, #000 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #000 75%),
                linear-gradient(-45deg, transparent 75%, #000 75%);
            background-color: #fff;
            background-size: 320px 320px;
            background-position: 0 0, 0 160px, 160px -160px, -160px 0;
            animation: ckr 24s linear infinite;
        }

        @keyframes ckr {
            0%   { transform: translate(0, 0) }
            12.5%{ transform: translate(-320px, 0) }
            25%  { transform: translate(0, 0) }
            37.5%{ transform: translate(320px, 0) }
            50%  { transform: translate(0, 0) }
            62.5%{ transform: translate(0, 320px) }
            75%  { transform: translate(0, 0) }
            87.5%{ transform: translate(0, -320px) }
            100% { transform: translate(0, 0) }
        }
    </style>


    <!-- Code highlight theme -->
    <link rel="stylesheet" href="../reveal.js/plugin/highlight/monokai.css">
</head>

<body>
    <div class="reveal">
        <div class="slides">
            <section data-markdown="main.md" data-separator="^---" data-separator-vertical="^--"
                data-separator-notes="^Note:" data-charset="utf-8">
            </section>
        </div>
    </div>


    <!-- Reveal.js core -->
    <script src="../reveal.js/dist/reveal.js"></script>
    <!-- Plugins -->
    <script src="../reveal.js/plugin/markdown/markdown.js"></script>
    <script src="../reveal.js/plugin/highlight/highlight.js"></script>
    <script src="../reveal.js/plugin/notes/notes.js"></script>
    <script src="../reveal.js/plugin/math/math.js"></script>
    <script src="plugin/reveal-svg-layers.umd.js"></script>

    <script>
        Reveal.initialize({
            hash: true,                 // Update URL as you navigate
            slideNumber: true,          // Show slide numbers
            transition: 'none',        // none/fade/slide/convex/concave/zoom
            plugins: [RevealMarkdown, RevealHighlight, RevealNotes, RevealMath.KaTeX, SvgLayers],
        });

        Reveal.on('ready', () => {
            document.querySelectorAll('.reveal .slides section').forEach(slide => {
                if (slide.querySelector('section')) return; // skip parent sections
                slide.querySelectorAll('p').forEach(p => {
                    if (p.textContent.trimStart().startsWith('Footnote:')) {
                        const footnote = document.createElement('div');
                        footnote.className = 'slide-footnote';
                        footnote.innerHTML = p.innerHTML.replace(/^Footnote:\s*/, '');
                        p.remove();
                        slide.classList.add('has-footnote');
                        slide.style.height = Reveal.getConfig().height + 'px';
                        slide.appendChild(footnote);
                    }
                });
            });
        });

        // Full-window checkerboard: show a body-level overlay (outside reveal's
        // scaled .slides transform) whenever the active slide carries a
        // .ckr-fullscreen marker, so it truly fills any screen/aspect ratio.
        (function () {
            function syncCheckerboard() {
                const slide = Reveal.getCurrentSlide();
                const wanted = !!(slide && slide.querySelector('.ckr-fullscreen')) && !Reveal.isOverview();
                let overlay = document.getElementById('ckr-overlay');
                if (wanted && !overlay) {
                    overlay = document.createElement('div');
                    overlay.id = 'ckr-overlay';
                    overlay.appendChild(document.createElement('div'));
                    document.body.appendChild(overlay);
                } else if (!wanted && overlay) {
                    overlay.remove();
                }
            }
            Reveal.on('ready', syncCheckerboard);
            Reveal.on('slidechanged', syncCheckerboard);
            Reveal.on('overviewshown', syncCheckerboard);
            Reveal.on('overviewhidden', syncCheckerboard);
        })();
    </script>
</body>

</html>
