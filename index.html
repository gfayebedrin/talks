<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>My Talks</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="https://unpkg.com/sakura.css/css/sakura.css" type="text/css">
  <style>
    :root {
      color-scheme: light dark;
    }

    /* covered by sakura.css
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      max-width: 60rem;
      margin: 2rem auto;
      padding: 0 1rem;
      line-height: 1.6;
    }
    */

    header {
      margin-bottom: 1.5rem;
    }

    /* covered by sakura.css
    h1 {
      font-size: 1.9rem;
      margin: 0 0 .5rem;
    }
    */

    .muted {
      color: #666;
      font-size: .95rem;
    }

    /* covered by sakura.css
    .markdown h2,
    .markdown h3 {
      margin-top: 1.25rem;
    }

    .markdown ul {
      padding-left: 1.2em;
    }
    */

    .md-error {
      color: #b00020;
      font-weight: 600;
    }

    nav {
      margin-bottom: 1.5rem;
    }

    nav a {
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      text-decoration: none;
      color: inherit;
      opacity: .75;
    }

    nav a:hover {
      opacity: 1;
    }

    nav svg {
      width: 1.1em;
      height: 1.1em;
    }
</style>
</head>

<body>
  <header>
    <h1>Guillaume Faye-Bédrin's talks</h1>
  </header>

  <nav>
    <a href="https://github.com/gfayebedrin/talks" title="View the repository on GitHub">
      <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
        <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0016 8c0-4.42-3.58-8-8-8z"/>
      </svg>
      View on GitHub
    </a>
  </nav>

  <!-- Auto-generated talks list goes here -->
  <section class="markdown" data-file="./talks.md">Loading…</section>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    (async function () {
      for (const el of document.querySelectorAll('.markdown')) {
        const src = el.getAttribute('data-file');
        try {
          const res = await fetch(src, { cache: 'no-store' });
          if (!res.ok) throw new Error(res.status);
          const md = await res.text();
          el.innerHTML = marked.parse(md);
        } catch (e) {
          el.classList.add('md-error');
          el.textContent = `Could not load ${src}: ${e.message}`;
        }
      }
    })();
  </script>
</body>

</html>
